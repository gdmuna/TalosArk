name: talos-ark_dev

services:
  valkey:
    image: ${VALKEY_IMAGE:?Set VALKEY_IMAGE in .env.}
    container_name: talos-ark_dev-valkey
    command:
      [
        'valkey-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes:
      - valkey-data:/data
    ports:
      - '${VALKEY_PORT:?Set VALKEY_PORT in .env.}:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  casdoor:
    image: ${CASDOOR_IMAGE:?Set CASDOOR_IMAGE in .env.}
    container_name: talos-ark_dev-casdoor
    command: ['-config', '/conf/app.conf']
    volumes:
      - type: bind
        source: ./casdoor/app.conf
        target: /conf/app.conf
        read_only: true
        bind:
          create_host_path: false
    ports:
      - '${CASDOOR_PORT:?Set CASDOOR_PORT in .env.}:8000'
    networks:
      - default
      - dev-infra
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail http://localhost:8000/']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  valkey-data:

networks:
  dev-infra:
    external: true
    name: ${POSTGRES_NETWORK:?Set POSTGRES_NETWORK in .env.}
