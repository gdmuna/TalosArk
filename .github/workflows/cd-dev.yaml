name: CD - Development (dev)

on:
  workflow_run:
    workflows: ['CI - Development (dev)']
    branches: [dev]
    types: [completed]

permissions:
  contents: read

env:
  NODE_ENV: test
  DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME || github.repository_owner }}
  BACKEND_IMAGE: ${{ vars.DOCKER_USERNAME || github.repository_owner }}/${{ vars.DOCKER_REPO_NAME || github.event.repository.name }}
  DOCS_IMAGE: ${{ vars.DOCKER_USERNAME || github.repository_owner }}/${{ vars.DOCKER_DOCS_REPO_NAME || format('{0}-docs', github.event.repository.name) }}

concurrency:
  group: cd-development
  cancel-in-progress: true

jobs:
  # ── 1. 构建并推送后端镜像 ───────────────────────────────────
  build-backend:
    name: Build & Push Backend Image
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      sha7: ${{ steps.meta.outputs.sha7 }}
      digest: ${{ steps.image.outputs.digest }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Extract build metadata
        id: meta
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          echo "sha7=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/backend/ops/docker/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:dev-latest
          build-args: |
            GIT_COMMIT=${{ github.event.workflow_run.head_sha }}
            APP_VERSION=dev-${{ steps.meta.outputs.sha7 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. 导出 OpenAPI JSON ────────────────────────────────────
  export-openapi:
    name: Export OpenAPI JSON
    needs: [build-backend]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Export from the built image with disposable dependencies
        env:
          EXPORT_IMAGE: ${{ env.BACKEND_IMAGE }}@${{ needs.build-backend.outputs.digest }}
        run: bash packages/backend/ops/docker/ci/export-openapi.sh "$EXPORT_IMAGE"

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v7
        with:
          name: openapi-json-${{ github.run_id }}
          path: packages/docsite/api-reference/openapi.json
          if-no-files-found: error
          retention-days: 7

  # ── 3. 构建并推送文档镜像（默认外部 API 参考）────────────
  build-docs:
    name: Build & Push Docs Image
    needs: [export-openapi]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download OpenAPI artifact
        uses: actions/download-artifact@v8
        with:
          name: openapi-json-${{ github.run_id }}
          path: packages/docsite/api-reference

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push docs image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/docsite/Dockerfile.dev
          push: true
          tags: |
            ${{ env.DOCS_IMAGE }}:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 4. 通知服务器拉取新镜像（Watchtower）─────────────────
  notify-server:
    name: Notify Server (Watchtower)
    needs: [build-backend, build-docs]
    runs-on: ubuntu-latest
    continue-on-error: true # 通知失败不阻断 CD 主流程

    steps:
      - name: Trigger Watchtower update
        run: |
          HTTP_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_HTTP_API_TOKEN }}" \
            "${{ secrets.WATCHTOWER_WEBHOOK_URL }}")
          if echo "$HTTP_STATUS" | grep -qE "^2"; then
            echo "✅ Watchtower notified successfully (HTTP $HTTP_STATUS)"
          else
            echo "⚠️ Watchtower returned HTTP $HTTP_STATUS"
            exit 1
          fi

  # ── 5. 推送 Swagger JSON 到 Apifox ─────────────────────────
  sync-apifox:
    name: Sync OpenAPI to Apifox
    needs: [export-openapi]
    runs-on: ubuntu-latest
    continue-on-error: true # Apifox 同步失败不阻断 CD 主流程

    steps:
      - name: Download OpenAPI artifact
        uses: actions/download-artifact@v8
        with:
          name: openapi-json-${{ github.run_id }}
          path: assets

      - name: Push OpenAPI to Apifox
        run: |
          RESPONSE=$(curl -sf --max-time 60 \
            -X POST "https://api.apifox.com/v1/projects/${{ secrets.APIFOX_PROJECT_ID }}/import-openapi?locale=zh-CN" \
            -H "X-Apifox-Api-Version: 2024-03-28" \
            -H "Authorization: Bearer ${{ secrets.APIFOX_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data-raw "$(jq -n \
              --slurpfile spec assets/openapi.json \
              '{
                input: { url: null, content: ($spec[0] | tojson) },
                options: {
                  endpointOverwriteBehavior: "OVERWRITE_EXISTING",
                  schemaOverwriteBehavior: "OVERWRITE_EXISTING",
                  updateFolderOfChangedEndpoint: true,
                  prependBasePath: false,
                  deleteUnmatchedResources: false
                }
              }')")
          echo "Apifox response:"
          echo "$RESPONSE" | python3 -m json.tool || echo "$RESPONSE"

  # ── 6. 汇总报告 ──────────────────────────────────────────────
  finished:
    name: CD Summary
    needs:
      - build-backend
      - export-openapi
      - build-docs
      - notify-server
      - sync-apifox
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate summary
        run: |
          TIMESTAMP_CN=$(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M:%S %Z")
          SHA="${{ github.event.workflow_run.head_sha }}"
          SHA7="${SHA:0:7}"
          CI_RESULT="${{ github.event.workflow_run.conclusion }}"

          status_icon() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              cancelled) echo "🚫" ;;
              skipped)   echo "⏭️" ;;
              *)         echo "❓" ;;
            esac
          }

          BB=$(status_icon "${{ needs.build-backend.result }}")
          EO=$(status_icon "${{ needs.export-openapi.result }}")
          BD=$(status_icon "${{ needs.build-docs.result }}")
          NS=$(status_icon "${{ needs.notify-server.result }}")
          SA=$(status_icon "${{ needs.sync-apifox.result }}")

          CI_ICON=$(status_icon "$CI_RESULT")

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          # 🚀 CD 报告 - Development

          **分支**: dev · **提交**: \`$SHA7\` · **时间**: $TIMESTAMP_CN

          ## CI 触发状态

          | 触发 CI 结果 | 状态 |
          |-------------|------|
          | CI - Development | $CI_ICON $CI_RESULT |

          ## 执行状态

          | Job | 状态 |
          |-----|------|
          | 后端镜像构建 | $BB ${{ needs.build-backend.result }} |
          | OpenAPI 导出 | $EO ${{ needs.export-openapi.result }} |
          | 文档镜像构建 | $BD ${{ needs.build-docs.result }} |
          | 服务器通知   | $NS ${{ needs.notify-server.result }} |
          | Apifox 同步  | $SA ${{ needs.sync-apifox.result }} |

          ## 镜像产物

          - \`${{ env.BACKEND_IMAGE }}:dev-latest\`
          - \`${{ env.DOCS_IMAGE }}:dev-latest\`
          EOF
